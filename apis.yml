apis:
- aid: depot-dev:depot-dev-github-actions-runners
  name: Depot GitHub Actions Runners
  tags:
  - GitHub Actions
  - Runners
  - CI/CD
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://depot.dev/docs/github-actions/overview
  baseURL: https://api.depot.dev
  properties:
  - url: https://depot.dev/docs/github-actions/overview
    type: Documentation
  - url: https://depot.dev/products/github-actions
    type: Documentation
  description: >-
    Managed, single-tenant GitHub Actions runners selected via runner labels (e.g. depot-ubuntu-24.04,
    depot-ubuntu-24.04-arm) across Intel, Arm/Graviton4, macOS, Windows, and GPU sizes. Runners are provisioned
    through a GitHub webhook integration rather than direct API calls; usage is billed per second at roughly
    half the cost of GitHub-hosted runners.
- aid: depot-dev:depot-dev-cache
  name: Depot Cache
  tags:
  - Remote Cache
  - Bazel
  - Turborepo
  - sccache
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://depot.dev/docs/cache/overview
  baseURL: https://api.depot.dev
  properties:
  - url: https://depot.dev/docs/cache/overview
    type: Documentation
  description: >-
    Depot Cache is a remote build cache backend that plugs into tools supporting remote caching (GitHub
    Actions, Bazel, Go, Turborepo, Gradle, Pants, sccache). It is consumed through each tool's native
    remote-cache protocol authenticated with a Depot token, not through a separate REST API.
